[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "feluga"
version = "2026.2.4"
description = "Tools for legacy-dolfin and DOLFINx solvers: one backend API, periodic spaces and refinement, assembly, transfers, XDMF and HDF5 I/O"
requires-python = ">=3.10"
license = {text = "LGPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)"]
# dolfin (legacy 2019.2) comes from apt, not pip, and is imported only where it is used.
# Install with --no-deps beside dolfin: a pip mpi4py would be built against another MPI.
dependencies = ["numpy", "h5py"]

[project.optional-dependencies]
# under MPI, reading a quadratic grid back, and feluga.probes and feluga.gradient
dolfin = ["mpi4py", "scipy", "cppimport", "pybind11", "petsc4py"]
# feluga.dolfinx's C++ (refinement, assembly) is built with CMake and nanobind
dolfinx = ["mpi4py", "scipy", "petsc4py", "nanobind", "cmake"]
test = ["pytest", "pytest-xdist"]

[project.scripts]
feluga-cut-facets = "feluga.facets:main"
feluga-build-dof-reorder = "feluga.dof_reorder:main"

[tool.setuptools.packages.find]
include = ["feluga*"]

[tool.setuptools.package-data]
# compiled by cppimport on import of feluga.probes or feluga.gradient, not before;
# cpp/dof_reorder_star.cpp by feluga-build-dof-reorder
feluga = ["cpp/*.cpp", "cpp/*.h"]
# built with CMake on first use of feluga.dolfinx.refine
"feluga.dolfinx" = ["cpp/*.cpp", "cpp/CMakeLists.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore::DeprecationWarning:ffc.*"]
markers = [
    "dolfin: needs legacy dolfin",
    "dolfinx: needs DOLFINx",
    "mpi: spawns mpirun; run serially",
    "slow: minutes, not seconds",
]
